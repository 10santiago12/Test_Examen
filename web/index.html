bad.map(x=>`<div class="card bad"><div>Pregunta ${x.k+1} · Tu respuesta: <b>${x.r}</b> · Correcta: <b class="ok">${x.q.a}</b></div><img src="img/${x.q.id}.jpg"></div>`).join('')}
